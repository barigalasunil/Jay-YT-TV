name: Build Jay TV APK

on:
  push:
    branches: [ master, main ]
    # Editing only channels.json (or docs) does NOT rebuild: the TV reads channels.json live from GitHub.
    paths-ignore:
      - 'channels.json'
      - 'links.txt'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Point the app at this repository
        run: |
          sed -i "s#YOUR_GITHUB_USER/YOUR_REPO#${GITHUB_REPOSITORY}#g" \
            common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/models/data/AllowList.java \
            common/src/stfdroid/res/values/update_urls.xml
          # bundled fallback copy of the list
          cp channels.json smarttubetv/src/main/assets/channels.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply app name and images from branding/
        run: |
          python -m pip install --quiet pillow
          python scripts/apply_branding.py

      - name: Configure signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret KEYSTORE_B64 is missing. Run scripts/setup-signing first (see README)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/kidtube.jks"
          {
            echo "storeFile=$GITHUB_WORKSPACE/kidtube.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStfdroidRelease

      - name: Prepare release files
        run: |
          APP_NAME=$(head -n 1 branding/app_name.txt 2>/dev/null | tr -d '\r')
          if [ -z "$APP_NAME" ]; then APP_NAME="KidTube"; fi
          SLUG=$(printf '%s' "$APP_NAME" | sed 's/[^A-Za-z0-9]\+/-/g; s/^-//; s/-$//')
          APK_NAME="${SLUG}.apk"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

          APK=$(ls smarttubetv/build/outputs/apk/stfdroid/release/*_universal.apk | head -n 1)
          cp "$APK" "$APK_NAME"
          N="${VERSION_CODE}"
          cat > kidtube.json <<JSON
          {
            "package": { "downloadUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${N}/${APK_NAME}" },
            "1.0.${N}": { "versionCode": ${N}, "changelog": ["${APP_NAME} build ${N}"] }
          }
          JSON
          cat kidtube.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION_CODE}" "$APK_NAME" kidtube.json \
            --title "${APP_NAME} build ${VERSION_CODE}" \
            --notes "Automatic build ${VERSION_CODE}. The TV app offers this update on next launch." \
            --latest
